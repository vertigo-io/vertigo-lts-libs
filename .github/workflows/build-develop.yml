name: Build Develop
# Build sur push suspendu le temps de trancher la ligne de version de ce dépôt.
# Les plugins ElasticSearch 5.6/7.17 ne fixent aucune version : ils importent le BOM
# vertigo-datafactory, qui en 5.0.0-SNAPSHOT est passé à co.elastic.clients et ne gère
# plus x-pack-transport, elasticsearch-rest-high-level-client, les modules codelibs,
# lucene 8.11.3, h2 ni c3p0. Le dépôt n'a plus été construit depuis la 4.3.0, que
# "init next version" a basculée en 5.0.0-SNAPSHOT en changeant une seule ligne.
# Pour réactiver : décommenter le déclencheur push ci-dessous.
on:
  workflow_dispatch:
  #push:
  #  branches:
  #    - develop
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    services:
        influxdb:
            image: influxdb:2.4
            env:
              DOCKER_INFLUXDB_INIT_MODE: setup
              DOCKER_INFLUXDB_INIT_USERNAME: vertigo
              DOCKER_INFLUXDB_INIT_PASSWORD: vertigo-password
              DOCKER_INFLUXDB_INIT_ORG: vertigo
              DOCKER_INFLUXDB_INIT_BUCKET: myApp
              DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: rytuvFE1f5JR4CPD1cOfr-74W2rL7tu1by-6DnO6zbTxMQy6foj7qtBMYSkFGT15Y1vjJCr5OP01Uci_ZdIlIA==
            ports:
              - 8086:8086
        analytics:
            image: vertigoio/vertigo-analytics-server:0.9.2
            env:
              INFLUXDB_URL: http://influxdb:8086
              INFLUXDB_TOKEN: rytuvFE1f5JR4CPD1cOfr-74W2rL7tu1by-6DnO6zbTxMQy6foj7qtBMYSkFGT15Y1vjJCr5OP01Uci_ZdIlIA==
            ports:
              - 4562:4562
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
          ref: develop
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 25
      # setup-java ne provisionne que le server d'id "github" ; le pom déclare aussi
      # github-core, github-connectors et github-libs, qui sinon partent sans
      # identifiants et se prennent un 401 sur maven.pkg.github.com.
      - name: Configure GitHub Packages credentials
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'EOF'
          <settings>
            <servers>
              <server><id>github</id><username>${env.GITHUB_ACTOR}</username><password>${env.GITHUB_TOKEN}</password></server>
              <server><id>github-core</id><username>${env.GITHUB_ACTOR}</username><password>${env.GITHUB_TOKEN}</password></server>
              <server><id>github-connectors</id><username>${env.GITHUB_ACTOR}</username><password>${env.GITHUB_TOKEN}</password></server>
              <server><id>github-libs</id><username>${env.GITHUB_ACTOR}</username><password>${env.GITHUB_TOKEN}</password></server>
            </servers>
          </settings>
          EOF
      # Analyse Sonar temporairement désactivée : SONAR_TOKEN rejeté par SonarCloud (HTTP 403)
      #- name: Cache SonarCloud packages
      #  uses: actions/cache@v6
      #  with:
      #    path: ~/.sonar/cache
      #    key: ${{ runner.os }}-sonar
      #    restore-keys: ${{ runner.os }}-sonar
      - name: Cache Maven packages
        uses: actions/cache@v6
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Update hosts
        run: |
          echo "127.0.0.1 analytica.part.klee.lan.net" | sudo tee -a /etc/hosts
          echo "127.0.0.1 docker-vertigo.part.klee.lan.net" | sudo tee -a /etc/hosts
      - name: Build and deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn -U clean source:jar org.jacoco:jacoco-maven-plugin:prepare-agent deploy org.jacoco:jacoco-maven-plugin:report -P Github
        # Commande complète avec analyse Sonar, à restaurer une fois SONAR_TOKEN renouvelé :
        #  env:
        #    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        #    SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        #  run: mvn clean source:jar org.jacoco:jacoco-maven-plugin:prepare-agent deploy org.jacoco:jacoco-maven-plugin:report org.sonarsource.scanner.maven:sonar-maven-plugin:3.9.1.2184:sonar -Dsonar.projectKey=vertigo-io_vertigo-lts-libs -Dsonar.organization=vertigo-io -Dsonar.host.url=https://sonarcloud.io -Dsonar.branch.name="develop" -P Github